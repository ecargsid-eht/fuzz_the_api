services:
  api:
    build: .
    command: fastapi run main.py --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      redis:
        condition: service_started

  fuzz-worker:
    build: .
    command: arq worker.FuzzWorkerSettings
    env_file:
      - .env.docker
    depends_on:
      redis:
        condition: service_started

  email-worker:
    build: .
    command: arq worker.EmailWorkerSettings
    env_file:
      - .env.docker
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data: